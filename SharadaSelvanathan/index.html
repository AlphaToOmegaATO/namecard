<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Founder of Alpha to Omega Singapore">
  <title>Sharada Selvanathan | Alpha to Omega</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      background: #f0f2f5;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      padding: 20px;
    }

    .instruction {
      margin-bottom: 18px;
      color: #555;
      font-size: 15px;
      text-align: center;
    }

    .card {
      width: 320px;
      height: 560px;          
      perspective: 1500px;
      cursor: pointer;
      position: relative;
    }

    .card-inner {
      width: 100%;
      height: 100%;
      position: relative;
      transition: transform 0.75s cubic-bezier(0.4, 0.2, 0.2, 1);
      transform-style: preserve-3d;
      border-radius: 16px;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.18);
    }

    .card.flipped .card-inner {
      transform: rotateY(180deg);
    }

    .card-front, .card-back {
      position: absolute;
      width: 100%;
      height: 100%;
      backface-visibility: hidden;
      border-radius: 16px;
      overflow: hidden;
    }

    .card-front img, .card-back img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .card-back {
      transform: rotateY(180deg);
    }

    .link-overlay {
      position: absolute;
      z-index: 10;
      background: rgba(255, 0, 0, 0.2);
    }

    .address-link {
      top: 32%;
      left: 12%;
      width: 76%;
      height: 11%;
    }
    
    .phone-link {
      top: 47%;
      left: 20%;
      width: 60%;
      height: 5%;
    }
    
    .email-link {
      top: 55%;
      left: 6%;
      width: 88%;
      height: 5%;
    }

    .website-link {
      top: 76%;
      left: 10%;
      width: 80%;
      height: 4%;
    }
    
    .link-overlay a {
      display: block;
      width: 100%;
      height: 100%;
    }

    /* Mobile optimization */
    @media (max-width: 380px) {
      .card {
        width: 90vw;
        height: calc(90vw * 1.75);
      }
    }
  </style>
</head>
<body>

  <div class="instruction">Tap the card to flip</div>

  <div class="card" id="businessCard">
    <div class="card-inner">
      <div class="card-front">
        <img src="front.png" alt="Front - Sharada Selvanathan">
        <div class="link-overlay address-link">
          <a href="https://www.google.com/maps/place/Alpha+to+Omega+Pte+Ltd/@1.306069,103.8260251,17z/data=!3m1!4b1!4m6!3m5!1s0x31da173a52a0f295:0x4e49bc160aa7f9e4!8m2!3d1.306069!4d103.8286!16s%2Fg%2F11c3mqc0d4?entry=ttu&g_ep=EgoyMDI2MTAyOC4wIKXMDSoASAFQAw%3D%3D" 
             title="Open address in Maps"
             target="_blank"
             rel="noopener"></a>
        </div>
        <div class="link-overlay phone-link">
          <a href="tel:+6593880915" title="Call +65 9388 0915"></a>
        </div>
        <div class="link-overlay email-link">
          <a href="mailto:sharada@alphatoomega.org" title="Email sharada@alphatoomega.org"></a>
        </div>
        <div class="link-overlay website-link">
          <a href="https://singapore.alphatoomega.org/" 
             title="Visit singapore.alphatoomega.org"
             target="_blank"
             rel="noopener"></a>
        </div> 
      </div>
      <div class="card-back">
        <img src="back.png" alt="Back - Alpha to Omega">
      </div>
    </div>
  </div>

  <script>
    const card = document.getElementById('businessCard');
    card.addEventListener('click', (e) => {
      if (e.target.closest('a')) return;
      card.classList.toggle('flipped');
    });
  </script>

</body>
</html>
